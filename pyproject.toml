[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotree"
version = "0.1.0"
description = "Cladogram visualization of the plate-rotation hierarchy in any GPlates .rot file"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Institute for Rock Magnetism"}]
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/Institute-for-Rock-Magnetism/rotree"

[project.scripts]
rotree = "rotree.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
